name: Specfaro Stripe evaluation
on:
  workflow_run:
    workflows: ["Specfaro pilot regression"]
    types: [completed]
permissions:
  contents: read
  actions: read
jobs:
  evaluate:
    if: >-
      (github.event.workflow_run.conclusion == 'failure' &&
       github.event.workflow_run.head_branch == github.event.repository.default_branch &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download pinned Specfaro worker
        shell: bash
        run: |
          curl --fail --silent --show-error --location --max-time 30 \
            https://dotte.duckdns.org/specfaro-local-kit.zip -o "$RUNNER_TEMP/kit.zip"
          echo '6cd1c58651051d994ef7c0bb6fe56d712b106a0c6ec79d36acc6806d408f5a9d  '"$RUNNER_TEMP/kit.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/kit.zip" -d "$RUNNER_TEMP/kit"
      - name: Reproduce, propose, and validate
        shell: bash
        env:
          PYTHONPATH: ${{ runner.temp }}/kit/specfaro-local-kit
          GH_TOKEN: ${{ github.token }}
        run: |
          python "$RUNNER_TEMP/kit/specfaro-local-kit/pilot_worker.py" . \
            --repository "$GITHUB_REPOSITORY" \
            --workflow-run "${{ github.event.workflow_run.id }}" \
            --event-file "$GITHUB_EVENT_PATH" \
            --output "$RUNNER_TEMP/specfaro-result"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: specfaro-stripe-evaluation
          path: ${{ runner.temp }}/specfaro-result/
          if-no-files-found: warn
          retention-days: 7
